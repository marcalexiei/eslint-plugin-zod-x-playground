version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    groups:
      # The subjects of this playground — fast-tracked (excluded from
      # minimumReleaseAge in pnpm-workspace.yaml) so releases get tested early.
      zod:
        applies-to: 'version-updates'
        patterns:
          - 'zod'
          - 'eslint-plugin-zod'
          - 'eslint-plugin-zod-mini'

      eslint:
        applies-to: 'version-updates'
        patterns:
          - '@eslint/js'
          - 'eslint'
          - 'typescript-eslint'
          - 'oxlint'

      format:
        applies-to: 'version-updates'
        patterns:
          - '@marcalexiei/oxfmt-config'
          - 'oxfmt'
