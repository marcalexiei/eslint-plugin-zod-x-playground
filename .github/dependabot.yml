version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 10
    groups:
      dev-format:
        applies-to: 'version-updates'
        dependency-type: 'development'
        patterns:
          - '@marcalexiei/prettier-config'
          - 'prettier'

      dev:
        applies-to: 'version-updates'
        dependency-type: 'development'
        patterns:
          - '@eslint/js'
          - '@types/*'
          - 'eslint'
          - 'oxlint'
          - 'oxlint-tsgolint'
          - 'eslint-plugin-zod'
          - 'typescript'
          - 'typescript-eslint'
    cooldown:
      default-days: 7
