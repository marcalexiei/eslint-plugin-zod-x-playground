packages:
  - 'examples/*'

catalog:
  '@eslint/js': 10.0.1
  '@marcalexiei/oxfmt-config': 1.2.1
  '@types/node': 26.4.0
  eslint: 10.9.1
  eslint-plugin-zod: 4.10.0
  eslint-plugin-zod-mini: 1.7.0
  oxfmt: 0.65.0
  oxlint: 1.80.0
  typescript: 7.0.2
  typescript-eslint: 8.68.0
  zod: 4.4.3

minimumReleaseAge: 1440 # 1 day
minimumReleaseAgeExclude:
  - '@eslint-zod/utils'
  - eslint-plugin-zod
  - eslint-plugin-zod-mini

trustPolicy: no-downgrade

# Fail a script run if node_modules is out of sync with the lockfile.
verifyDepsBeforeRun: error
